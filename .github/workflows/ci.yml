name: validation
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: local-admin-only, POSTGRES_DB: tenantforge}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tenantforge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q --cov=tenantforge --cov-report=term-missing
        env:
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:local-admin-only@localhost:5432/tenantforge
          TEST_DATABASE_URL: postgresql+psycopg://rag_app:local-app-only@localhost:5432/tenantforge
          TEST_WORKER_DATABASE_URL: postgresql+psycopg://rag_worker:local-worker-only@localhost:5432/tenantforge
      - run: docker compose config -q
      - run: docker compose build
