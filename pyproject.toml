[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantforge-rag"
version = "0.1.0"
description = "Runnable multi-tenant retrieval augmented generation reference platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.14", "uvicorn==0.34.3", "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9", "pgvector==0.4.1", "pypdf==5.7.0",
  "python-docx==1.2.0", "beautifulsoup4==4.13.4", "httpx[socks]==0.28.1",
  "PyJWT[crypto]==2.10.1", "python-multipart==0.0.20",
  "prometheus-client==0.22.1", "boto3==1.38.46",
  "opentelemetry-api==1.34.1", "opentelemetry-sdk==1.34.1",
  "opentelemetry-exporter-otlp-proto-http==1.34.1"
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.1", "reportlab==4.4.2"]
semantic = ["sentence-transformers>=3.4,<6"]

[project.scripts]
tenantforge = "tenantforge.__main__:main"

[tool.setuptools.packages.find]
include = ["tenantforge*"]
[tool.setuptools.package-data]
tenantforge = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs TEST_DATABASE_URL and TEST_WORKER_DATABASE_URL"]
[tool.ruff]
line-length = 110

